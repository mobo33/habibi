<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Qualche domanda, solo per te 💌</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Nunito:wght@400;600;700&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          blush: '#FDEEF1', petal: '#F7CDD7', rose: '#D9647E',
          roseDeep: '#B84865', plum: '#5B2A45', lilac: '#EDE3F7', gold: '#C9A46A'
        },
        fontFamily: {
          display: ['"Cormorant Garamond"', 'Georgia', 'serif'],
          body: ['Nunito', 'system-ui', 'sans-serif'],
          script: ['"Dancing Script"', 'cursive']
        }
      }
    }
  }
</script>
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html, body { min-height: 100%; }
  body {
    font-family: Nunito, system-ui, sans-serif;
    background:
      radial-gradient(1200px 600px at 10% -10%, #EDE3F7 0%, transparent 60%),
      radial-gradient(900px 600px at 110% 110%, #F7CDD7 0%, transparent 55%),
      #FDEEF1;
    color: #5B2A45;
    overflow-x: hidden;
  }

  /* ---------- Floating hearts ---------- */
  #hearts { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .heart {
    position: absolute; bottom: -40px; opacity: 0;
    animation: floatUp linear forwards;
    filter: drop-shadow(0 2px 4px rgba(217,100,126,.25));
  }
  @keyframes floatUp {
    0%   { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
    10%  { opacity: .85; }
    50%  { transform: translateY(-55vh) translateX(var(--drift)) rotate(12deg); }
    100% { transform: translateY(-115vh) translateX(calc(var(--drift) * -1)) rotate(-10deg); opacity: 0; }
  }

  /* ---------- Card & motion ---------- */
  .letter {
    background: rgba(255,255,255,.82);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(217,100,126,.18);
    box-shadow: 0 30px 60px -25px rgba(91,42,69,.35), 0 0 0 8px rgba(255,255,255,.35);
  }
  .screen { animation: enter .55s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes enter {
    from { opacity: 0; transform: translateY(18px) scale(.98); }
    to   { opacity: 1; transform: none; }
  }
  .btn { transition: transform .18s ease, box-shadow .18s ease, background-color .18s ease; }
  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: translateY(0) scale(.97); }
  button:focus-visible, textarea:focus-visible { outline: 3px solid #C9A46A; outline-offset: 3px; }

  .pulse-heart { animation: beat 1.4s ease-in-out infinite; display: inline-block; }
  @keyframes beat {
    0%,100% { transform: scale(1); } 15% { transform: scale(1.18); }
    30% { transform: scale(1); } 45% { transform: scale(1.12); }
  }
  .wiggle { animation: wiggle .45s ease; }
  @keyframes wiggle { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-3deg); } 75% { transform: rotate(3deg); } }

  .burst { position: fixed; pointer-events: none; z-index: 60; animation: burst 1.1s ease-out forwards; }
  @keyframes burst {
    from { opacity: 1; transform: translate(0,0) scale(.6); }
    to   { opacity: 0; transform: translate(var(--x), var(--y)) scale(1.2) rotate(var(--r)); }
  }

  /* ---------- "Ti voglio bene" runaway button ---------- */
  #loveBtn.escaped {
    position: fixed; z-index: 40; margin: 0; width: auto;
    transition: left .35s cubic-bezier(.3,1.5,.5,1), top .35s cubic-bezier(.3,1.5,.5,1);
  }
  .tease {
    position: fixed; z-index: 45; left: 50%;
    top: calc(24px + env(safe-area-inset-top, 0px));
    transform: translateX(-50%);
    background: #fff; color: #5B2A45; font-weight: 700;
    border: 2px solid #F7CDD7; border-radius: 999px;
    padding: .7rem 1.4rem; font-size: 1.1rem; white-space: nowrap;
    box-shadow: 0 14px 30px -12px rgba(91,42,69,.45);
    animation: teaseIn 1.6s ease forwards; pointer-events: none;
  }
  @keyframes teaseIn {
    0%   { opacity: 0; transform: translate(-50%, -14px) scale(.8); }
    12%  { opacity: 1; transform: translate(-50%, 0) scale(1.06); }
    20%  { transform: translate(-50%, 0) scale(1); }
    80%  { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -8px); }
  }
  .rain { position: fixed; top: -40px; z-index: 55; pointer-events: none; animation: rain linear forwards; }
  @keyframes rain { to { transform: translateY(115vh) rotate(var(--r)); opacity: .9; } }
  .bigHeart { animation: bigHeart 1.2s cubic-bezier(.2,1.4,.4,1) both, beat 1.4s ease-in-out 1.2s infinite; display: inline-block; }
  @keyframes bigHeart { from { transform: scale(0) rotate(-20deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }

  textarea { resize: vertical; }

  @media (prefers-reduced-motion: reduce) {
    .heart, .pulse-heart, .screen, .burst, .wiggle, .rain, .bigHeart, .tease { animation: none !important; }
    .heart, .rain { display: none; }
    #loveBtn.escaped { transition: none; }
  }
  @media print {
    #hearts, .no-print { display: none !important; }
    body { background: #fff; }
    .letter { box-shadow: none; border: 1px solid #ddd; }
  }
</style>
</head>
<body class="min-h-screen">

<div id="hearts" aria-hidden="true"></div>

<main class="relative z-10 min-h-screen flex items-center justify-center px-4 py-10">
  <div id="app" class="w-full max-w-xl"></div>
</main>

<div id="modal" class="fixed inset-0 z-50 hidden items-center justify-center px-4"
     style="background: rgba(91,42,69,.35); backdrop-filter: blur(4px);"></div>

<script>
/* =========================================================
   CONFIG — personalise here
   ========================================================= */
const CONFIG = {
  herName: '',          // e.g. 'Sara' (empty = "Ciao amore,")
  fromName: '',         // your name for the signature (empty = "— io")
  storageKey: 'loveQuestionnaire.v1'
};

const QUESTIONS = [
  { type: 'yn',   text: 'Ti è piaciuta la nostra ultima volta insieme quanto è piaciuta a me?', confirm: true },
  { type: 'yn',   text: 'Il tuo cuore ha sorriso quando ci siamo visti, proprio come il mio?' },
  { type: 'yn',   text: 'Ti sei sentita a tuo agio e felice quanto mi sono sentito io con te?' },
  { type: 'yn',   text: 'Hai pensato a me dopo che ci siamo salutati?' },
  { type: 'yn',   text: 'Ti piacerebbe che la nostra prossima volta insieme fosse ancora più speciale?' },
  { type: 'text', text: 'Qual è stato il tuo momento preferito quando ci siamo visti?', placeholder: 'Il momento che continuo a ripensare è…' },
  { type: 'text', text: 'Cosa ti è piaciuto di più del tempo passato insieme?', placeholder: 'Mi è piaciuto…' },
  { type: 'text', text: 'C’è qualcosa che avresti voluto fare diversamente?', placeholder: 'Sii sincera, voglio saperlo…' },
  { type: 'text', text: 'Qual è una cosa che ti fa sempre sentire più vicina a me?', placeholder: 'Mi sento più vicina a te quando…' },
  { type: 'text', text: 'C’è un messaggio o un pensiero che vorresti lasciarmi adesso?', placeholder: 'Scrivi tutto quello che vuoi…' }
];

const CONFIRM_STEPS = ['Sei sicura? 💕', 'Sei davvero sicura?', 'Sicurissima?'];
const TEASES = ['Riprova! 😉', 'Quasi presa! 🙈', 'Troppo lenta! 😜', 'Ok… ancora una volta 🥰'];
const MAX_ESCAPES = 4;

/* =========================================================
   State & storage
   ========================================================= */
const state = {
  step: -1,                                  // -1 welcome, 0..9 questions, 10 thank-you
  answers: Array(QUESTIONS.length).fill(''),
  confirmStage: 0,
  lastSubmission: null
};
const app = document.getElementById('app');
const modal = document.getElementById('modal');

function loadSubmissions() {
  try { const raw = localStorage.getItem(CONFIG.storageKey); return raw ? JSON.parse(raw) : []; }
  catch (e) { return []; }
}
function saveSubmissions(list) {
  try { localStorage.setItem(CONFIG.storageKey, JSON.stringify(list)); return true; }
  catch (e) { return false; }
}

/* =========================================================
   Helpers
   ========================================================= */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const reducedMotion = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function formatDate(iso) {
  try { return new Date(iso).toLocaleString('it-IT', { dateStyle: 'medium', timeStyle: 'short' }); }
  catch (e) { return iso; }
}
function submissionAsText(sub) {
  let out = `💌 Risposte — ${formatDate(sub.date)}\n\n`;
  QUESTIONS.forEach((q, i) => { out += `${i + 1}. ${q.text}\n→ ${sub.answers[i] || '(nessuna risposta)'}\n\n`; });
  return out.trim();
}
function heartBurst(x, y, count = 14) {
  if (reducedMotion()) return;
  const emojis = ['💗','💕','💖','🌸','✨','💞'];
  for (let i = 0; i < count; i++) {
    const el = document.createElement('span');
    el.className = 'burst';
    el.textContent = emojis[i % emojis.length];
    const angle = (Math.PI * 2 * i) / count, dist = 70 + Math.random() * 80;
    el.style.left = x + 'px'; el.style.top = y + 'px';
    el.style.fontSize = (14 + Math.random() * 14) + 'px';
    el.style.setProperty('--x', Math.cos(angle) * dist + 'px');
    el.style.setProperty('--y', Math.sin(angle) * dist + 'px');
    el.style.setProperty('--r', (Math.random() * 60 - 30) + 'deg');
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1200);
  }
}
function burstFrom(el) { const r = el.getBoundingClientRect(); heartBurst(r.left + r.width / 2, r.top + r.height / 2); }
function openModal(html) { modal.innerHTML = html; modal.classList.remove('hidden'); modal.classList.add('flex'); }
function closeModal() { modal.classList.add('hidden'); modal.classList.remove('flex'); modal.innerHTML = ''; }
function clearOverlays() { closeModal(); document.querySelectorAll('.tease').forEach(t => t.remove()); }

/* Floating hearts */
(function floatingHearts() {
  const box = document.getElementById('hearts');
  const glyphs = ['❤','♡','💗','💕','🌸'];
  function spawn() {
    if (document.hidden) return;
    const h = document.createElement('span');
    h.className = 'heart';
    h.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];
    h.style.left = Math.random() * 100 + 'vw';
    h.style.fontSize = (12 + Math.random() * 22) + 'px';
    h.style.color = ['#D9647E','#F7A8B8','#C9A46A','#B84865'][Math.floor(Math.random() * 4)];
    h.style.setProperty('--drift', (Math.random() * 60 - 30) + 'px');
    const dur = 9 + Math.random() * 9;
    h.style.animationDuration = dur + 's';
    box.appendChild(h);
    setTimeout(() => h.remove(), dur * 1000);
  }
  for (let i = 0; i < 6; i++) setTimeout(spawn, i * 600);
  setInterval(spawn, 1100);
})();

/* =========================================================
   Hash router
   ========================================================= */
function route() {
  clearOverlays();
  const hash = window.location.hash.replace(/^#\/?/, '').toLowerCase();
  if (hash === 'admin') {
    document.title = 'Risultati 🗝️';
    renderAdmin();
  } else {
    document.title = 'Qualche domanda, solo per te 💌';
    renderQuiz();
  }
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
// Admin view updates live if she answers in another tab of the same browser
window.addEventListener('storage', e => {
  if (e.key === CONFIG.storageKey && window.location.hash.toLowerCase().includes('admin')) renderAdmin();
});

/* =========================================================
   QUIZ VIEW (default route)
   ========================================================= */
function renderQuiz() {
  if (state.step === -1) return renderWelcome();
  if (state.step >= QUESTIONS.length) return renderThanks();
  return renderQuestion();
}

function renderWelcome() {
  const greet = CONFIG.herName ? `Ciao ${esc(CONFIG.herName)},` : 'Ciao amore,';
  app.innerHTML = `
    <section class="screen letter rounded-[2rem] px-7 py-10 sm:px-12 sm:py-14 text-center">
      <div class="text-5xl mb-4 pulse-heart" aria-hidden="true">💌</div>
      <p class="font-script text-3xl text-rose mb-2">${greet}</p>
      <h1 class="font-display text-4xl sm:text-5xl font-semibold leading-tight text-plum">
        Ho preparato una piccola cosa, solo per te
      </h1>
      <p class="mt-5 text-plum/75 leading-relaxed max-w-md mx-auto">
        Dieci piccole domande su di noi. Cinque veloci, e cinque in cui puoi dire tutto quello che hai nel cuore.
        Prenditi il tuo tempo: non ci sono risposte sbagliate.
      </p>
      <button id="startBtn" class="btn mt-9 bg-rose hover:bg-roseDeep text-white font-bold rounded-full px-9 py-4 text-lg shadow-lg shadow-rose/30">
        Iniziamo 💕
      </button>
    </section>`;
  document.getElementById('startBtn').onclick = e => { burstFrom(e.currentTarget); state.step = 0; renderQuiz(); };
}

function progressBar() {
  const total = QUESTIONS.length, pct = Math.round((state.step / total) * 100);
  return `
    <div class="mb-7">
      <div class="flex justify-between text-sm text-plum/60 mb-2 font-semibold">
        <span>${state.step < 5 ? 'Prima parte' : 'Seconda parte'}</span>
        <span>Domanda ${state.step + 1} di ${total}</span>
      </div>
      <div class="h-2 rounded-full bg-petal/60 overflow-hidden" role="progressbar" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${state.step}">
        <div class="h-full rounded-full bg-gradient-to-r from-rose to-gold transition-all duration-500" style="width:${pct}%"></div>
      </div>
      <div class="flex justify-between mt-2 px-0.5" aria-hidden="true">
        ${QUESTIONS.map((_, i) => `<span class="text-xs ${i < state.step ? 'text-rose' : i === state.step ? 'text-roseDeep' : 'text-petal'}">${i <= state.step ? '♥' : '♡'}</span>`).join('')}
      </div>
    </div>`;
}

function renderQuestion() {
  const q = QUESTIONS[state.step];
  const isLast = state.step === QUESTIONS.length - 1;
  let body;

  if (q.type === 'yn') {
    body = `
      <div class="grid grid-cols-2 gap-4 mt-9">
        <button data-ans="Sì" class="btn ansBtn bg-rose hover:bg-roseDeep text-white font-bold rounded-2xl py-5 text-xl shadow-lg shadow-rose/30">Sì 💗</button>
        <button data-ans="No" class="btn ansBtn bg-white hover:bg-blush text-plum font-bold rounded-2xl py-5 text-xl border-2 border-petal">No</button>
      </div>`;
  } else {
    const nextBtn = isLast
      ? `<div class="mt-5 min-h-[64px] flex justify-center items-center">
           <button id="loveBtn" class="btn bg-gradient-to-r from-rose to-roseDeep text-white font-bold rounded-full px-9 py-4 text-xl shadow-xl shadow-rose/40">
             Ti voglio bene 💖
           </button>
         </div>`
      : `<button id="nextBtn" class="btn mt-5 w-full bg-rose hover:bg-roseDeep text-white font-bold rounded-full py-4 text-lg shadow-lg shadow-rose/30">Avanti ♥</button>`;
    body = `
      <label for="txt" class="sr-only">La tua risposta</label>
      <textarea id="txt" rows="5" maxlength="2000"
        class="mt-7 w-full rounded-2xl border-2 border-petal bg-white/90 p-4 text-lg leading-relaxed text-plum placeholder:text-plum/35 focus:border-rose focus:outline-none"
        placeholder="${esc(q.placeholder)}">${esc(state.answers[state.step])}</textarea>
      <div class="flex justify-between items-center mt-2 text-sm text-plum/50">
        <span id="hint">&nbsp;</span>
        <span id="count">${state.answers[state.step].length}/2000</span>
      </div>
      ${nextBtn}`;
  }

  app.innerHTML = `
    <section class="screen letter rounded-[2rem] px-6 py-8 sm:px-11 sm:py-11" id="card">
      ${progressBar()}
      <h2 class="font-display text-3xl sm:text-4xl font-semibold leading-snug text-plum text-center">${esc(q.text)}</h2>
      ${body}
      <div class="flex justify-between items-center mt-8">
        ${state.step > 0 ? `<button id="backBtn" class="btn text-plum/60 hover:text-plum font-semibold text-sm">← Indietro</button>` : '<span></span>'}
        <span class="font-script text-xl text-rose/70">con amore</span>
      </div>
    </section>`;

  const back = document.getElementById('backBtn');
  if (back) back.onclick = () => { clearOverlays(); state.step--; renderQuiz(); };

  if (q.type === 'yn') {
    document.querySelectorAll('.ansBtn').forEach(btn => {
      btn.onclick = e => {
        const ans = btn.dataset.ans;
        state.answers[state.step] = ans;
        if (ans === 'Sì') burstFrom(e.currentTarget);
        if (q.confirm && ans === 'Sì') { state.confirmStage = 0; openConfirm(); }
        else setTimeout(advance, ans === 'Sì' ? 350 : 120);
      };
    });
    return;
  }

  const ta = document.getElementById('txt');
  const count = document.getElementById('count');
  const hint = document.getElementById('hint');
  ta.focus();
  ta.oninput = () => {
    state.answers[state.step] = ta.value;
    count.textContent = `${ta.value.length}/2000`;
    hint.innerHTML = '&nbsp;';
  };

  // returns true if the answer is filled, otherwise nudges her
  const requireText = () => {
    if (ta.value.trim()) return true;
    hint.textContent = 'Scrivi qualcosina prima 🌸';
    hint.className = 'text-roseDeep font-semibold';
    const card = document.getElementById('card');
    card.classList.remove('wiggle'); void card.offsetWidth; card.classList.add('wiggle');
    ta.focus();
    return false;
  };

  if (isLast) {
    setupLoveButton(requireText, () => {
      state.answers[state.step] = ta.value.trim();
      submit();
    });
  } else {
    document.getElementById('nextBtn').onclick = e => {
      if (!requireText()) return;
      state.answers[state.step] = ta.value.trim();
      burstFrom(e.currentTarget);
      setTimeout(advance, 250);
    };
  }
}

function advance() { state.step++; renderQuiz(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

/* ---------- Q1: playful 3-step confirmation ---------- */
function openConfirm() {
  const last = state.confirmStage === CONFIRM_STEPS.length - 1;
  openModal(`
    <div class="screen letter rounded-[2rem] w-full max-w-sm px-7 py-9 text-center" role="dialog" aria-modal="true" aria-labelledby="cTitle">
      <div class="text-4xl mb-3 pulse-heart" aria-hidden="true">${['🥺','🤭','😳'][state.confirmStage]}</div>
      <h3 id="cTitle" class="font-display text-3xl font-semibold text-plum">${CONFIRM_STEPS[state.confirmStage]}</h3>
      <p class="text-plum/60 mt-2 text-sm">Passo ${state.confirmStage + 1} di ${CONFIRM_STEPS.length}</p>
      <div class="flex flex-col gap-3 mt-7">
        <button id="cYes" class="btn bg-rose hover:bg-roseDeep text-white font-bold rounded-full py-3.5 text-lg shadow-lg shadow-rose/30">
          ${last ? 'Sicurissima! 💖' : 'Sì, sono sicura'}
        </button>
        <button id="cNo" class="btn text-plum/70 hover:text-plum font-semibold py-2">Mmm, fammi pensare ancora</button>
      </div>
    </div>`);
  const yes = document.getElementById('cYes');
  yes.focus();
  yes.onclick = e => {
    burstFrom(e.currentTarget);
    if (last) { closeModal(); setTimeout(advance, 300); }
    else { state.confirmStage++; openConfirm(); }
  };
  document.getElementById('cNo').onclick = () => { closeModal(); state.answers[0] = ''; };
}

/* ---------- Q10: "Ti voglio bene" runaway button ---------- */
function setupLoveButton(requireText, onSuccess) {
  const btn = document.getElementById('loveBtn');
  let escapes = 0, lastMove = 0, done = false;

  function showTease(text) {
    document.querySelectorAll('.tease').forEach(t => t.remove());
    const t = document.createElement('div');
    t.className = 'tease';
    t.setAttribute('role', 'status');
    t.textContent = text;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 1700);
  }

  function jump() {
    lastMove = Date.now();
    const r = btn.getBoundingClientRect();
    if (!btn.classList.contains('escaped')) {
      btn.style.left = r.left + 'px';
      btn.style.top = r.top + 'px';
      btn.classList.add('escaped');
      void btn.offsetWidth;
    }
    const pad = 16, topSafe = 84;
    const maxX = Math.max(pad, window.innerWidth - r.width - pad);
    const maxY = Math.max(topSafe, window.innerHeight - r.height - pad - 40);
    let x, y, tries = 0;
    do {
      x = pad + Math.random() * (maxX - pad);
      y = topSafe + Math.random() * (maxY - topSafe);
      tries++;
    } while (tries < 25 && Math.hypot(x - r.left, y - r.top) < Math.min(window.innerWidth, window.innerHeight) * 0.3);
    btn.style.left = x + 'px';
    btn.style.top = y + 'px';
    showTease(TEASES[escapes]);
    escapes++;
  }

  const canRun = () => !done && escapes < MAX_ESCAPES && Date.now() - lastMove > 450;

  // Desktop: flee on hover (only once she has written her answer)
  btn.addEventListener('pointerenter', e => {
    if (e.pointerType !== 'mouse' || !document.getElementById('txt').value.trim()) return;
    if (canRun()) jump();
  });

  // Touch / keyboard / fast mouse: flee on the tap itself
  btn.addEventListener('click', e => {
    e.preventDefault();
    if (done) return;
    if (!requireText()) return;
    if (escapes < MAX_ESCAPES) {
      if (canRun()) jump();            // a click right after a hover-jump is the same attempt
      return;
    }
    // 5th attempt: caught!
    done = true;
    document.querySelectorAll('.tease').forEach(t => t.remove());
    burstFrom(btn);
    btn.remove();
    onSuccess();
  });
}

/* ---------- Submit + celebration ---------- */
function submit() {
  const sub = { id: Date.now().toString(36), date: new Date().toISOString(), answers: [...state.answers] };
  const list = loadSubmissions();
  list.push(sub);
  saveSubmissions(list);
  state.lastSubmission = sub;
  celebrate();
}

function celebrate() {
  if (!reducedMotion()) {
    const glyphs = ['💖','💕','💗','🌹','❤️','✨','💞'];
    for (let i = 0; i < 70; i++) {
      setTimeout(() => {
        const h = document.createElement('span');
        h.className = 'rain';
        h.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];
        h.style.left = Math.random() * 100 + 'vw';
        h.style.fontSize = (16 + Math.random() * 26) + 'px';
        h.style.setProperty('--r', (Math.random() * 360 - 180) + 'deg');
        const d = 2.5 + Math.random() * 2.5;
        h.style.animationDuration = d + 's';
        document.body.appendChild(h);
        setTimeout(() => h.remove(), d * 1000 + 100);
      }, i * 45);
    }
    [0, 400, 800].forEach((t, k) => setTimeout(() =>
      heartBurst(window.innerWidth * (0.3 + 0.2 * k), window.innerHeight * 0.45, 22), t));
  }
  openModal(`
    <div class="screen letter rounded-[2rem] w-full max-w-sm px-7 py-10 text-center" role="dialog" aria-modal="true" aria-labelledby="loveTitle">
      <div class="text-7xl mb-4 bigHeart" aria-hidden="true">💖</div>
      <h3 id="loveTitle" class="font-display text-4xl font-semibold text-plum leading-tight">L’hai preso!</h3>
      <p class="font-script text-3xl text-rose mt-3">Anch’io ti voglio bene</p>
      <p class="text-plum/75 mt-4 leading-relaxed">E questa volta non scappo da nessuna parte. 🥰</p>
      <button id="loveNext" class="btn mt-7 bg-rose hover:bg-roseDeep text-white font-bold rounded-full px-8 py-3.5 shadow-lg shadow-rose/30">
        Continua 💕
      </button>
    </div>`);
  const next = document.getElementById('loveNext');
  next.focus();
  next.onclick = () => { closeModal(); state.step = QUESTIONS.length; renderQuiz(); };
}

function renderThanks() {
  const signoff = CONFIG.fromName ? `— ${esc(CONFIG.fromName)}` : '— io';
  app.innerHTML = `
    <section class="screen letter rounded-[2rem] px-7 py-10 sm:px-12 sm:py-14 text-center">
      <div class="text-6xl mb-4 pulse-heart" aria-hidden="true">💖</div>
      <h2 class="font-display text-4xl sm:text-5xl font-semibold text-plum leading-tight">Grazie</h2>
      <p class="mt-5 text-lg text-plum/80 leading-relaxed max-w-md mx-auto">
        Ogni risposta che hai scritto significa per me più di quanto immagini.
        Le leggerò con calma, e non vedo già l’ora di rivederti.
      </p>
      <p class="font-script text-3xl text-rose mt-6">${signoff}</p>
    </section>`;

}

/* =========================================================
   ADMIN VIEW (#admin)
   ========================================================= */
function renderAdmin(note = '') {
  const all = loadSubmissions();
  const list = all.slice().reverse();

  const cards = list.length ? list.map((sub, idx) => `
    <article class="rounded-2xl bg-white/90 border border-petal p-5 sm:p-6 mb-5">
      <header class="flex flex-wrap justify-between items-baseline gap-2 mb-4">
        <h3 class="font-display text-2xl font-semibold text-plum">Risposta ${list.length - idx}${idx === 0 ? ' 🌟' : ''}</h3>
        <span class="text-sm text-plum/60">${formatDate(sub.date)}</span>
      </header>
      <ol class="space-y-4">
        ${QUESTIONS.map((q, i) => `
          <li>
            <p class="text-sm text-plum/60 font-semibold">${i + 1}. ${esc(q.text)}</p>
            ${q.type === 'yn'
              ? `<p class="mt-1 inline-block rounded-full px-3 py-0.5 text-sm font-bold ${sub.answers[i] === 'Sì' ? 'bg-rose text-white' : 'bg-lilac text-plum'}">${esc(sub.answers[i] || '—')}${q.confirm && sub.answers[i] === 'Sì' ? ' (confermato 3 volte 💕)' : ''}</p>`
              : `<p class="mt-1 text-plum leading-relaxed whitespace-pre-wrap font-display text-xl">${esc(sub.answers[i] || '—')}</p>`}
          </li>`).join('')}
      </ol>
      <div class="no-print mt-5">
        <button data-copy="${esc(sub.id)}" class="btn copyOne text-sm font-semibold text-roseDeep hover:text-plum">Copia come testo</button>
      </div>
    </article>`).join('')
    : `<div class="text-center py-10">
         <div class="text-4xl mb-3" aria-hidden="true">🌷</div>
         <p class="text-plum/75">Nessuna risposta salvata su questo dispositivo.</p>
         <p class="text-sm text-plum/55 mt-2 max-w-sm mx-auto">Le risposte restano nel browser in cui lei le compila.</p>
       </div>`;

  app.innerHTML = `
    <section class="screen letter rounded-[2rem] px-5 py-8 sm:px-9 sm:py-10">
      <div class="flex flex-wrap justify-between items-center gap-3 mb-6">
        <div>
          <h2 class="font-display text-3xl sm:text-4xl font-semibold text-plum">Le sue risposte</h2>
          <p class="text-sm text-plum/60">${list.length} salvate su questo dispositivo</p>
        </div>
        <a href="#" class="btn no-print rounded-full px-5 py-2.5 font-semibold border-2 border-petal text-plum hover:bg-blush">Vai al questionario</a>
      </div>
      <div class="no-print flex flex-wrap gap-2 mb-4">
        <button id="refreshBtn" class="btn rounded-full px-4 py-2 text-sm font-bold bg-plum text-white hover:bg-roseDeep">↻ Aggiorna</button>
        ${list.length ? `
        <button id="expTxt" class="btn rounded-full px-4 py-2 text-sm font-bold bg-rose text-white hover:bg-roseDeep">Scarica testo</button>
        <button id="expPrint" class="btn rounded-full px-4 py-2 text-sm font-bold bg-white border-2 border-petal text-plum hover:bg-blush">Stampa o salva PDF</button>
        <button id="clearAll" class="btn rounded-full px-4 py-2 text-sm font-bold bg-white border-2 border-rose text-roseDeep hover:bg-blush">Cancella dati</button>` : ''}
      </div>
      <p id="adminMsg" class="text-sm text-roseDeep font-semibold mb-3 min-h-[1.25rem]" role="status">${esc(note)}</p>
      ${cards}
    </section>`;

  const msg = document.getElementById('adminMsg');

  document.getElementById('refreshBtn').onclick = () => renderAdmin('Aggiornato.');

  const t = document.getElementById('expTxt');
  if (t) t.onclick = () => {
    const blob = new Blob([all.map(submissionAsText).join('\n\n──────────\n\n')], { type: 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'le-sue-risposte.txt';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  const p = document.getElementById('expPrint');
  if (p) p.onclick = () => window.print();

  const c = document.getElementById('clearAll');
  if (c) c.onclick = () => {
    if (confirm('Cancellare tutte le risposte salvate su questo dispositivo? L’azione non si può annullare.')) {
      saveSubmissions([]);
      state.step = -1; state.answers = Array(QUESTIONS.length).fill(''); state.lastSubmission = null;
      renderAdmin('Dati cancellati.');
    }
  };

  document.querySelectorAll('.copyOne').forEach(b => b.onclick = async () => {
    const sub = all.find(s => s.id === b.dataset.copy);
    try { await navigator.clipboard.writeText(submissionAsText(sub)); msg.textContent = 'Copiato negli appunti.'; }
    catch (e) { msg.textContent = 'Copia non riuscita: usa “Scarica testo”.'; }
  });
}

/* Start */
route();
</script>
</body>
